<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Test Checkbox</title>
    <style>
        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 1rem;
            cursor: pointer;
            padding: 0.5rem;
            border: 1px solid #ccc;
            margin: 0.5rem;
        }
        .checkbox-label:hover {
            background: #f0f0f0;
        }
        input[type="checkbox"] {
            width: 1.5rem;
            height: 1.5rem;
            accent-color: #6366f1;
        }
    </style>
</head>
<body>
    <h3>环境接触史测试</h3>
    <label class="checkbox-label">
        <input type="checkbox" name="environment" value="粉尘">
        <span>粉尘</span>
    </label>
    <label class="checkbox-label">
        <input type="checkbox" name="environment" value="有害气体">
        <span>有害气体</span>
    </label>
    <label class="checkbox-label">
        <input type="checkbox" name="environment" value="宠物">
        <span>宠物</span>
    </label>
    <label class="checkbox-label">
        <input type="checkbox" name="environment" value="无">
        <span>无</span>
    </label>

    <h3>当前选中的值：</h3>
    <p id="result">无</p>

    <script>
        const checkboxes = document.querySelectorAll('input[type="checkbox"]');
        const result = document.getElementById('result');

        checkboxes.forEach(cb => {
            cb.addEventListener('change', () => {
                const selected = Array.from(checkboxes)
                    .filter(c => c.checked)
                    .map(c => c.value);
                result.textContent = selected.length > 0 ? selected.join(', ') : '无';
                console.log('选中的值:', selected);
            });
        });
    </script>
</body>
</html>
